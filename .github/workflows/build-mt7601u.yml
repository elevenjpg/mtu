name: Build mt7601u WiFi modules (arm64 GKI)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: Kernel source repo
        default: https://android.googlesource.com/kernel/common
      kernel_ref:
        description: Branch, tag or commit sha (short sha is fine)
        default: 71f3aedc8b92
      kernel_release:
        description: Exact `uname -r` from the phone
        default: 5.10.236-android12-9-00006-g71f3aedc8b92-ab14427738

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      REPO: ${{ inputs.kernel_repo }}
      REF: ${{ inputs.kernel_ref }}
      REL: ${{ inputs.kernel_release }}
      LLVM_IAS: 1
      ARCH: arm64
      LLVM: 1
      CROSS_COMPILE: aarch64-linux-gnu-
      KCFLAGS: -Wno-error
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm flex bison bc libssl-dev libelf-dev cpio kmod gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Fetch kernel source (shallow)
        run: |
          git clone --filter=blob:none --no-checkout "$REPO" kernel-src
          cd kernel-src
          git checkout "$REF"
          git log -1 --format='checked out %H %s'

      - name: Configure
        run: |
          test -f phone.config || { echo "Commit phone.config (zcat /proc/config.gz) to the repo root"; exit 1; }
          cp phone.config kernel-src/.config
          cd kernel-src
          BASE="${REL%%-*}"
          SUFFIX="-${REL#*-}"
          touch .scmversion
          scripts/config --disable LOCALVERSION_AUTO --set-str LOCALVERSION "$SUFFIX"
          scripts/config --disable TRIM_UNUSED_KSYMS --set-str UNUSED_KSYMS_WHITELIST ""
          scripts/config --enable WLAN --enable WLAN_VENDOR_MEDIATEK --disable DEBUG_INFO_BTF
          scripts/config --module CFG80211 --module MAC80211 --module MT7601U
          make ARCH=arm64 LLVM=1 olddefconfig
          for o in CFG80211 MAC80211 MT7601U; do
            grep -q "^CONFIG_$o=m" .config || { echo "::error::CONFIG_$o did not end up =m (a dependency is off)"; exit 1; }
          done
          GOT="$(make -s ARCH=arm64 LLVM=1 kernelrelease)"
          echo "source version : $(make -s kernelversion)"
          echo "kernelrelease  : $GOT"
          echo "phone uname -r : $REL"
          [ "$GOT" = "$REL" ] || { echo "::error::Release mismatch: source base version differs from phone (need $BASE). Use the right branch/tag/commit."; exit 1; }
          grep -E "TRIM_UNUSED_KSYMS|MODVERSIONS|CFG80211|MAC80211|MT7601U" .config || true

      - name: Build
        run: |
          cd kernel-src
          make ARCH=arm64 LLVM=1 -j"$(nproc)" modules

      - name: Collect modules
        run: |
          mkdir out
          cd kernel-src
          find . -name '*.ko' -exec cp {} ../out/ \;
          cd ../out
          llvm-strip --strip-debug *.ko
          ls -l
          for m in cfg80211 mac80211 libarc4 mt7601u; do
            [ -f $m.ko ] && { echo "== $m"; modinfo $m.ko | grep -E "vermagic|depends"; }
          done

      - name: Check symbols against GKI allowlist
        continue-on-error: true
        run: |
          cd kernel-src
          cat android/abi_gki_aarch64* | grep -vE '^\[|^#|^[[:space:]]*$' | sed 's/^[[:space:]]*//' | sort -u > /tmp/allow
          cd ../out
          for m in cfg80211 mac80211 libarc4 mt7601u; do
            [ -f $m.ko ] && { llvm-nm --defined-only $m.ko | awk '{print $3}'; } 
          done | sort -u > /tmp/defined
          for m in cfg80211 mac80211 libarc4 mt7601u; do
            [ -f $m.ko ] && llvm-nm -u $m.ko | awk '{print $2}'
          done | sort -u > /tmp/undef
          echo "Symbols the modules need that are NOT on the allowlist (may fail to load):"
          comm -23 /tmp/undef /tmp/allow | comm -23 - /tmp/defined | tee /tmp/missing
          echo "count: $(wc -l < /tmp/missing)"

      - uses: actions/upload-artifact@v4
        with:
          name: mt7601u-modules
          path: out/*.ko
