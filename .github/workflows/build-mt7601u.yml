name: Build mt7601u WiFi modules (arm64 GKI)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: Kernel source repo
        default: https://android.googlesource.com/kernel/common
      kernel_ref:
        description: Branch, tag or commit sha (short sha is fine)
        default: 71f3aedc8b92
      kernel_release:
        description: Exact `uname -r` from the phone
        default: 5.10.236-android12-9-00006-g71f3aedc8b92-ab14427738

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      REPO: ${{ inputs.kernel_repo }}
      REF: ${{ inputs.kernel_ref }}
      REL: ${{ inputs.kernel_release }}
      LLVM_IAS: 1
      ARCH: arm64
      LLVM: 1
      CROSS_COMPILE: aarch64-linux-gnu-
      KCFLAGS: -Wno-error

    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm flex bison bc libssl-dev libelf-dev cpio kmod gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Fetch kernel source (shallow)
        run: |
          git clone --filter=blob:none --no-checkout "$REPO" kernel-src
          cd kernel-src
          git checkout "$REF"
          git log -1 --format='checked out %H %s'

      - name: Configure
        run: |
          test -f phone.config || { echo "Commit phone.config (zcat /proc/config.gz) to the repo root"; exit 1; }

          cp phone.config kernel-src/.config

          cd kernel-src

          BASE="${REL%%-*}"
          SUFFIX="-${REL#*-}"

          touch .scmversion

          scripts/config --disable LOCALVERSION_AUTO
          scripts/config --set-str LOCALVERSION "$SUFFIX"

          scripts/config --disable TRIM_UNUSED_KSYMS
          scripts/config --set-str UNUSED_KSYMS_WHITELIST ""

          scripts/config --enable WLAN
          scripts/config --enable WLAN_VENDOR_MEDIATEK

          scripts/config --disable DEBUG_INFO
          scripts/config --disable DEBUG_INFO_BTF

          # Do NOT replace the phone's cfg80211.
          # Do NOT build a second mac80211 against our own cfg80211.
          #
          # Keep the existing phone/GKI wireless stack configuration.
          scripts/config --disable CFG80211
          scripts/config --disable MAC80211

          # MT7601U requires mac80211/cfg80211, so enable the driver
          # as a module. The dependency handling is intentionally left
          # to Kconfig.
          scripts/config --module MT7601U

          make ARCH=arm64 LLVM=1 olddefconfig

          echo "=== FINAL CONFIG ==="
          grep -E "^(CONFIG_(WLAN|WLAN_VENDOR_MEDIATEK|CFG80211|MAC80211|MT7601U|TRIM_UNUSED_KSYMS|MODVERSIONS))=" .config || true

          echo
          echo "=== KERNEL RELEASE ==="

          GOT="$(make -s ARCH=arm64 LLVM=1 kernelrelease)"

          echo "source version : $(make -s ARCH=arm64 LLVM=1 kernelversion)"
          echo "kernelrelease  : $GOT"
          echo "phone uname -r : $REL"

          [ "$GOT" = "$REL" ] || {
            echo "::error::Release mismatch: source base version differs from phone (need $BASE). Use the right branch/tag/commit."
            exit 1
          }

      - name: Machine info
        run: |
          echo "cpus: $(nproc)"
          free -m | head -2
          df -h / | tail -1
          clang --version | head -1

      - name: Prepare kernel
        run: |
          cd kernel-src

          make ARCH=arm64 LLVM=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            modules_prepare

      - name: Build MT7601U
        run: |
          set -o pipefail
          cd kernel-src

          make ARCH=arm64 LLVM=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            -j"$(nproc)" \
            M=drivers/net/wireless/mediatek/mt7601u \
            modules 2>&1 | tee ../build-mt7601u.log

      - name: Collect modules
        run: |
          mkdir out
          cd kernel-src

          find drivers/net/wireless/mediatek/mt7601u \
            -name '*.ko' \
            -exec cp {} ../out/ \;

          cd ../out

          llvm-strip --strip-debug *.ko

          echo "=== OUTPUT ==="
          ls -l

          for m in mt7601u; do
            [ -f "$m.ko" ] && {
              echo "== $m"
              modinfo "$m.ko" | grep -E "^(filename|vermagic|depends|firmware|alias)"
            }
          done

      - name: Check MT7601U symbols
        continue-on-error: true
        run: |
          cd out

          echo "=== UNDEFINED SYMBOLS ==="
          llvm-nm -u mt7601u.ko | awk '{print $2}' | sort -u

          echo
          echo "=== MODINFO ==="
          modinfo mt7601u.ko

      - uses: actions/upload-artifact@v4
        with:
          name: mt7601u-modules
          path: out/*.ko

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-*.log
          if-no-files-found: ignore